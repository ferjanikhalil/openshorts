services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174
      # Keep transcription memory small on low-RAM hosts (Docker Desktop VM):
      # 'base' uses ~140MB vs 'small' ~460MB, and capping threads stops
      # CTranslate2 from spiking memory with per-thread buffers.
      - WHISPER_MODEL=base
      - WHISPER_COMPUTE=int8
      - OMP_NUM_THREADS=2
      - CLIP_WORKERS=1
    mem_limit: 5g
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
