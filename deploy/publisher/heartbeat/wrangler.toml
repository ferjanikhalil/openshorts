# Cloudflare Worker that keeps the publishing host awake.
#
#   npx wrangler login           # once, opens a browser
#   npx wrangler deploy          # from this directory
#   npx wrangler tail            # live logs
#
# Free plan, no credit card: 100,000 requests/day and 5 cron triggers. This uses
# one trigger and ~4,300 requests a month.

name = "openshorts-publisher-heartbeat"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Ten minutes is far more often than the host's idle timeout requires — Render
# spins a free service down after ~15 minutes, so this never lets it get there.
# The interval is set by how fast you want to hear that the publisher died, not by
# how fast it falls asleep.
[triggers]
crons = ["*/10 * * * *"]

[vars]
# The publisher's health endpoint. Not a secret — it is a public URL, since the
# provider's webhook has to reach the same host.
HEARTBEAT_URL = "https://openshorts-publisher.onrender.com/api/publishing/health"
# How long to wait for a response before calling the tick a failure. A cold start
# can exceed this; that is expected and is why an alert needs two consecutive
# failures. Measured 2026-08-22: a spun-down Render answered in 23.2 s, which the
# old 25 s value would have called a failure by a 1.8 s margin. Waiting on the
# network is not CPU time, so a generous value costs nothing against the free
# plan's 10 ms CPU cap.
TIMEOUT_MS = "60000"

# Telegram alerting. Secrets, NOT vars — set them out of band so they never enter
# this file or your shell history:
#     npx wrangler secret put TELEGRAM_BOT_TOKEN
#     npx wrangler secret put TELEGRAM_CHAT_ID
# Same bot and chat as the app's own alerts (cloud/alerts.py). Leave them unset
# and the worker still keeps the host awake; it just logs instead of notifying.

# Optional but recommended: one KV namespace, used only to remember whether you
# have already been told about the current outage. Without it the worker falls
# back to at most one alert per hour; with it you get exactly one alert when the
# publisher goes down and one when it comes back.
#
#     npx wrangler kv namespace create HEARTBEAT_STATE
#
# then uncomment these two lines and paste the id it prints.
# [[kv_namespaces]]
# binding = "STATE"
# id = "<paste the id from the command above>"
